name: Validate RaceDay Repository

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required documentation
        run: |
          echo "Checking RaceDay documentation..."
          test -f README.md
          test -f docs/RaceDay_ERD.png
          test -f docs/RaceDay_API_Endpoint_Plan.pdf
          test -f docs/RaceDay_Database.sql
          echo "Required documentation found."

      - name: Check repository structure
        run: |
          echo "Checking repository structure..."
          test -d docs
          test -d .github/workflows
          echo "Repository structure is valid."

      - name: Validation successful
        run: |
          echo "RaceDay repository validation completed successfully."
